<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - eCommerce</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">ShopNow</div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/products">Products</a></li>
      </ul>
      <div class="hamburger">☰</div>
    </nav>
  </header>

  <main>
    <div class="product-detail">
      <img src="https://via.placeholder.com/400" alt="Product">
      <div class="product-info">
        <h2>Product Name</h2>
        <p class="price">Rs. 1500</p>
        <p>This is a great product that is best for you.</p>
        <button class="btn">Add to Cart</button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 ShopNow</p>
  </footer>
</body>
</html>
