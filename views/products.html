<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - eCommerce</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">ShopNow</div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/products">Products</a></li>
      </ul>
      <div class="hamburger">☰</div>
    </nav>
  </header>

  <main>
    <h2 class="page-title">All Products</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="https://via.placeholder.com/200" alt="Product 1">
        <h3>Product 1</h3>
        <p>Rs. 1500</p>
        <a href="/products/1" class="btn">View Details</a>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/200" alt="Product 2">
        <h3>Product 2</h3>
        <p>Rs. 2500</p>
        <a href="/products/2" class="btn">View Details</a>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/200" alt="Product 3">
        <h3>Product 3</h3>
        <p>Rs. 3500</p>
        <a href="/products/3" class="btn">View Details</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 ShopNow</p>
  </footer>
</body>
</html>
